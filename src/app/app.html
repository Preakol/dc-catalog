<div class="min-h-screen bg-slate-900 text-slate-200">
  <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/80 backdrop-blur-sm">
    <div class="mx-auto flex max-w-7xl items-center gap-3 px-6 py-4">
      <a routerLink="/" class="flex items-center gap-2">
        <span class="text-xl font-bold tracking-tight text-sky-400">{{ title }}</span>
      </a>
      <span class="hidden text-xs text-slate-400 sm:inline"
        >DC heroes &middot; Angular &middot; Signals</span
      >

      <nav class="ml-auto flex items-center gap-1" aria-label="Main">
        <a
          routerLink="/my-heroes"
          routerLinkActive="bg-slate-800 text-slate-100"
          class="rounded-lg px-3 py-2 text-sm text-slate-400 transition hover:text-sky-400"
        >
          My heroes
        </a>

        <button
          type="button"
          (click)="openDrawer()"
          [class.bg-slate-800]="drawerOpen()"
          [class.text-slate-100]="drawerOpen()"
          class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-400 transition hover:text-sky-400"
        >
          Cart
          @if (cartCount(); as count) {
            <span
              class="rounded-full bg-sky-600 px-2 py-0.5 text-[11px] font-semibold tabular-nums text-white"
            >
              {{ count }}
            </span>
          }
        </button>
      </nav>
    </div>

    @if (demoMode) {
      <div class="border-t border-slate-800 bg-amber-500/10 px-6 py-2 text-xs text-amber-200">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-3">
          <span
            >Demo mode: there is no backend here, so changes to the catalogue are saved in this
            browser.</span
          >
          <button
            type="button"
            (click)="resetDemoData()"
            [disabled]="resetting()"
            class="rounded-md px-2 py-1 font-medium text-amber-100 ring-1 ring-amber-400/40 transition hover:bg-amber-500/20 disabled:opacity-50"
          >
            {{ resetting() ? 'Resetting...' : 'Reset demo data' }}
          </button>
          @if (resetFailed()) {
            <span class="text-rose-300">Could not load the demo data.</span>
          }
        </div>
      </div>
    }
  </header>

  <main class="mx-auto max-w-7xl px-6 py-8">
    <router-outlet />
  </main>

  <dc-compare-panel />
  <dc-cart-drawer [open]="drawerOpen()" (closed)="closeDrawer()" />
</div>
