<div class="min-h-screen bg-slate-900 text-slate-200">
  <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/80 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center gap-3 px-6 py-4">
      <a routerLink="/" class="flex items-center gap-2">
        <span class="text-xl font-bold tracking-tight text-sky-400">{{ title }}</span>
      </a>
      <span class="hidden text-xs text-slate-500 sm:inline">DC heroes &middot; Angular 12 &middot; RxJS</span>

      <nav class="ml-auto flex items-center gap-1">
        <a routerLink="/my-heroes" routerLinkActive="bg-slate-800 text-slate-100"
           class="rounded-lg px-3 py-2 text-sm text-slate-400 transition hover:text-sky-400">
          My heroes
        </a>

        <a routerLink="/cart" routerLinkActive="bg-slate-800 text-slate-100"
           class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-400
                  transition hover:text-sky-400">
          Cart
          <span *ngIf="(cartCount$ | async) as count"
                class="rounded-full bg-sky-600 px-2 py-0.5 text-[11px] font-semibold
                       tabular-nums text-white">
            {{ count }}
          </span>
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-8">
    <router-outlet></router-outlet>
  </main>
</div>
