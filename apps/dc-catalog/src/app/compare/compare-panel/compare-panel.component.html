<div *ngIf="(entries$ | async)?.length"
     class="sticky bottom-0 z-30 border-t border-slate-700 bg-slate-900/90 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-3 px-6 py-3">
    <span class="text-[11px] uppercase tracking-wide text-slate-500">
      Compare
      <span class="font-mono text-slate-400">{{ (entries$ | async)?.length }}/{{ limit }}</span>
    </span>

    <ul class="flex flex-wrap items-center gap-2">
      <li *ngFor="let entry of entries$ | async; trackBy: trackByHeroId"
          class="flex items-center gap-2 rounded-lg bg-slate-800 py-1 pl-1 pr-2 ring-1 ring-slate-700">
        <img [src]="entry.imageUrl" [alt]="entry.name" loading="lazy"
             class="h-8 w-8 rounded object-cover" />
        <span class="max-w-[8rem] truncate text-xs text-slate-200">{{ entry.name }}</span>
        <button type="button" (click)="onRemove(entry.heroId)"
                [attr.aria-label]="'Remove ' + entry.name + ' from comparison'"
                class="rounded px-1 text-sm leading-none text-slate-500 transition hover:text-rose-300">
          &times;
        </button>
      </li>
    </ul>

    <div class="ml-auto flex items-center gap-2">
      <button type="button" (click)="onClear()"
              class="rounded-lg px-3 py-2 text-xs text-slate-400 transition hover:text-slate-200">
        Clear
      </button>
      <a routerLink="/compare" [queryParams]="{ ids: idsParam$ | async }"
         class="rounded-lg bg-sky-600 px-4 py-2 text-xs font-medium text-white transition hover:bg-sky-500">
        Compare &rarr;
      </a>
    </div>
  </div>
</div>
