<article
  class="group flex flex-col overflow-hidden rounded-xl bg-slate-800/80 ring-1 ring-slate-700
         transition hover:ring-sky-500/60 hover:shadow-lg hover:shadow-sky-500/10">

  <div class="relative aspect-[3/4] overflow-hidden bg-slate-900">
    <img [src]="imageUrl" [alt]="hero.name" loading="lazy"
         class="h-full w-full object-cover transition duration-300 group-hover:scale-105" />

    <span class="absolute right-2 top-2 rounded-full px-2 py-0.5 text-[10px] font-semibold uppercase
                 tracking-wide ring-1 backdrop-blur"
          [ngClass]="alignmentClass">
      {{ alignment }}
    </span>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-4">
    <header>
      <h3 class="truncate text-base font-semibold text-slate-100" [title]="hero.name">{{ hero.name }}</h3>
      <p *ngIf="showFullName" class="truncate text-xs text-slate-400" [title]="fullName">{{ fullName }}</p>
      <p class="mt-1 text-[11px] uppercase tracking-wide text-slate-500">{{ race }}</p>
    </header>

    <div class="flex flex-col gap-1.5">
      <div *ngFor="let stat of stats" class="flex items-center gap-2">
        <span class="w-9 font-mono text-[10px] tracking-wider text-slate-500">{{ stat.label }}</span>
        <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-700/70">
          <div class="h-full rounded-full bg-gradient-to-r from-sky-500 to-cyan-400"
               [style.width.%]="stat.value"></div>
        </div>
        <span class="w-6 text-right font-mono text-[10px] tabular-nums text-slate-400">{{ stat.value }}</span>
      </div>
    </div>

    <div class="mt-auto flex gap-2 pt-1">
      <a [routerLink]="['/heroes', hero.id, 'edit']"
         class="flex-1 rounded-lg bg-slate-700 px-3 py-1.5 text-center text-xs font-medium text-slate-100
                transition hover:bg-slate-600">
        Edit
      </a>
      <button type="button" (click)="onDeleteClick()"
              class="rounded-lg px-3 py-1.5 text-xs font-medium text-rose-300 ring-1 ring-rose-500/40
                     transition hover:bg-rose-500/20">
        Delete
      </button>
    </div>
  </div>
</article>
