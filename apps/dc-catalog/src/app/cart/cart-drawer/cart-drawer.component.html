<div *ngIf="open" (click)="closed.emit()"
     class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm"></div>

<aside role="dialog" aria-modal="true" aria-label="Cart"
       class="fixed right-0 top-0 z-[60] flex h-full w-full max-w-sm flex-col
              border-l border-slate-800 bg-slate-900 shadow-2xl
              transition-transform duration-300"
       [class.translate-x-0]="open"
       [class.translate-x-full]="!open">

  <header class="flex items-center gap-3 border-b border-slate-800 px-5 py-4">
    <h2 class="text-lg font-semibold text-slate-100">Cart</h2>
    <button type="button" (click)="closed.emit()" aria-label="Close cart"
            class="ml-auto rounded-lg px-2 py-1 text-xl leading-none text-slate-500
                   transition hover:text-slate-200">
      &times;
    </button>
  </header>

  <ng-container *ngIf="items$ | async as items">
    <div *ngIf="items.length === 0"
         class="flex flex-1 flex-col items-center justify-center gap-2 px-6 text-center">
      <p class="text-slate-300">The cart is empty.</p>
      <p class="text-sm text-slate-500">Pick a hero in the catalog and press Buy.</p>
    </div>

    <div *ngIf="items.length > 0" class="flex min-h-0 flex-1 flex-col">
      <ul class="flex-1 overflow-y-auto px-5 py-4">
        <li *ngFor="let item of items; trackBy: trackByHeroId"
            class="mb-3 flex items-center gap-3 rounded-xl bg-slate-800/70 p-2 ring-1 ring-slate-700">
          <img [src]="item.imageUrl" [alt]="item.name" loading="lazy"
               class="h-12 w-12 shrink-0 rounded-lg object-cover ring-1 ring-slate-600" />
          <a [routerLink]="['/heroes', item.heroId]"
             class="min-w-0 flex-1 truncate text-sm font-medium text-slate-100
                    transition hover:text-sky-400">
            {{ item.name }}
          </a>
          <span class="font-mono text-xs tabular-nums text-slate-300">
            {{ item.price | currency: 'EUR':'symbol':'1.0-0' }}
          </span>
          <button type="button" (click)="onRemove(item.heroId)"
                  [attr.aria-label]="'Remove ' + item.name"
                  class="rounded-lg px-2 py-1 text-xs text-rose-300 ring-1 ring-rose-500/40
                         transition hover:bg-rose-500/20">
            &times;
          </button>
        </li>
      </ul>

      <footer class="border-t border-slate-800 px-5 py-4">
        <div class="mb-3 flex items-baseline justify-between">
          <span class="text-sm text-slate-400">{{ items.length }} hero(es)</span>
          <span class="font-mono text-xl tabular-nums text-slate-100">
            {{ total$ | async | currency: 'EUR':'symbol':'1.0-0' }}
          </span>
        </div>

        <a routerLink="/cart"
           class="block rounded-lg bg-sky-600 px-4 py-2.5 text-center text-sm font-medium
                  text-white transition hover:bg-sky-500">
          Checkout &rarr;
        </a>

        <button type="button" (click)="onClear()"
                class="mt-3 w-full text-xs text-slate-500 underline transition hover:text-slate-300">
          Clear the cart
        </button>
      </footer>
    </div>
  </ng-container>
</aside>
